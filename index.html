<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Happy Birthday</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 30px rgba(0,0,0,0.2);
      max-width: 350px;
    }
    img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ff4b8b;
    }
    h1 {
      color: #ff2a6d;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="photo.jpg" alt="Birthday Photo">
    <h1>Happy Birthday ❤️</h1>
    <p>This page is live using GitHub Pages</p>
  </div>
</body>
</html>
